    <mask id="lq-punch" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1080">
      <rect width="1080" height="1080" fill="#fff"/>
      <use href="#lq-star" fill="#000"/>
      <circle cx="357.72" cy="715.58" r="104.63" fill="#000"/>
    </mask>
    <g id="lq-mark">
      <g mask="url(#lq-punch)">
        <circle cx="358.23" cy="715.07" r="156.93" fill="url(#lq-ring-grad)"/>
        <rect x="377.45" y="708.21" width="84.9" height="162.44" fill="url(#lq-ring-grad)"/>
      </g>
    </g>
