      <stop offset="0" stop-color="#55b9e8"/>
      <stop offset="0.38" stop-color="#a088ee"/>
      <stop offset="0.7" stop-color="#ec8cba"/>
      <stop offset="1" stop-color="#f2a23e"/>
    </linearGradient>
