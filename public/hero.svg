  <style>
    .sans { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, "Courier New", monospace; }
    @keyframes lq-float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }
    .lq-float { animation: lq-float 7s ease-in-out infinite; }
    @keyframes lq-blink {
      0%, 54% { opacity: 0.9; }
      55%, 100% { opacity: 0; }
    }
    .lq-cursor { animation: lq-blink 1.15s linear infinite; }
    @keyframes lq-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .lq-live { animation: lq-pulse 2.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .lq-float, .lq-cursor, .lq-live { animation: none; } }
  </style>

  <rect width="1200" height="400" rx="28" fill="url(#hero-bg)" stroke="#d3e2f2" stroke-width="1.5"/>
  <g clip-path="url(#bg-clip)">
    <circle cx="1112" cy="28" r="138" fill="#a5c9ee" opacity="0.5" filter="url(#soft-glow)"/>
    <circle cx="705" cy="392" r="120" fill="#9fc3ec" opacity="0.4" filter="url(#soft-glow)"/>
    <ellipse cx="116" cy="192" rx="82" ry="82" fill="#a5c9ee" opacity="0.5" filter="url(#soft-glow)"/>
  </g>

  <g aria-hidden="true" fill="none" stroke-linecap="round">
    <path d="M694 28H1154" stroke="#9db8d9" stroke-opacity="0.55"/>
    <path d="M694 372H1154" stroke="#9db8d9" stroke-opacity="0.4"/>
    <path d="M708 14V386" stroke="#9db8d9" stroke-opacity="0.35"/>
    <path d="M1140 14V386" stroke="#9db8d9" stroke-opacity="0.35"/>
  </g>

  <g id="title-block">
    <g transform="translate(-30.1 -99.6) scale(0.4078)">
      <g class="lq-float"><use href="#lq-mark"/></g>
    </g>
    <g transform="translate(196 54)">
      <text class="mono" x="0" y="0" fill="#7d90ad" font-size="14" letter-spacing="2.2">TASK ORCHESTRATION · LOCAL-FIRST RUNTIME</text>
      <text class="sans" x="0" y="92" font-size="74" font-weight="700" letter-spacing="-3">
        <tspan fill="#223349">Lo</tspan><tspan fill="#3f97dd">quat</tspan>
      </text>
      <rect x="2" y="110" width="148" height="5" rx="2.5" fill="url(#brand-line)"/>
      <text class="sans" x="0" y="162" fill="#35435c" font-size="27" font-weight="600">把零散的自动化，结成成熟的果实。</text>
      <text class="sans" x="0" y="199" fill="#35435c" font-size="27" font-weight="600">声明式流水线 · 本地优先 · 开箱即用。</text>
      <text class="sans" x="0" y="244" fill="#7d90ad" font-size="16">一个运行时，编排任务、分发事件、暴露类型化 API 与实时状态。</text>
      <g transform="translate(0 274)">
        <rect width="128" height="34" rx="17" fill="#ffffff" stroke="#c7dcf2"/>
        <circle cx="18" cy="17" r="4" fill="#2f7fd0"/>
        <text class="mono" x="31" y="22" fill="#2c5170" font-size="13">Windows x64</text>
        <g transform="translate(140 0)">
          <rect width="174" height="34" rx="17" fill="#f4f9ff" stroke="#c7dcf2"/>
          <circle cx="18" cy="17" r="4" fill="#5aaef0"/>
          <text class="mono" x="31" y="22" fill="#2c5170" font-size="13">Linux x64 / arm64</text>
        </g>
        <g transform="translate(326 0)">
          <rect width="120" height="34" rx="17" fill="#eef5fd" stroke="#b9d4ee"/>
          <circle cx="18" cy="17" r="4" fill="#8ec8f7"/>
          <text class="mono" x="31" y="22" fill="#2c5170" font-size="13">TypeScript</text>
        </g>
      </g>
    </g>
  </g>

  <g id="project-proof" transform="translate(734 58)">
    <text class="mono" x="-12" y="0" fill="#7d90ad" font-size="13" letter-spacing="1.8">LIVE FROM THE ORCHARD</text>
    <g transform="translate(-12 18)">
      <rect x="12" y="13" width="404" height="276" rx="18" fill="#d7e4f4" stroke="#b9cde6" opacity="0.6"/>
      <rect x="6" y="6.5" width="404" height="276" rx="18" fill="#e6eef9" stroke="#c6d8ec" opacity="0.8"/>
      <rect width="404" height="276" rx="18" fill="url(#core-fill)" stroke="#3f5a82" stroke-opacity="0.9"/>
      <g clip-path="url(#card-clip)">
        <rect x="0" y="0" width="404" height="40" fill="#1d3050"/>
        <line x1="0" y1="40" x2="404" y2="40" stroke="#2d4266"/>
        <text class="mono" x="18" y="25" fill="#d3e5fa" font-size="12.5">loquat › harvest-042</text>
        <text class="mono" x="352" y="24.5" fill="#8ba3c4" font-size="10.5" text-anchor="end">attached</text>
        <circle class="lq-live" cx="388" cy="20" r="4" fill="#74d2ff"/>

        <text class="mono" x="22" y="72" font-size="13"><tspan fill="#8ba3c4">$</tspan><tspan fill="#ffc978"> loquat</tspan><tspan fill="#eef4fc"> run harvest-042</tspan><tspan fill="#8ba3c4"> --watch</tspan></text>
        <rect class="lq-cursor" x="284" y="61" width="8" height="15" fill="#ffc978"/>

        <circle cx="30" cy="104" r="5" fill="#74d2ff"/>
        <text class="mono" x="44" y="108" fill="#eef4fc" font-size="13">pick</text>
        <text class="mono" x="118" y="108" fill="#74d2ff" font-size="11.5">done</text>
        <text class="mono" x="196" y="108" fill="#8ba3c4" font-size="11.5">12ms</text>
        <rect x="236" y="98" width="144" height="6" rx="3" fill="#2a3d5e"/>
        <rect x="236" y="98" width="24" height="6" rx="3" fill="#74d2ff" opacity="0.9"/>

        <circle cx="30" cy="132" r="5" fill="#bba7ff"/>
        <text class="mono" x="44" y="136" fill="#eef4fc" font-size="13">polish</text>
        <text class="mono" x="118" y="136" fill="#bba7ff" font-size="11.5">done</text>
        <text class="mono" x="196" y="136" fill="#8ba3c4" font-size="11.5">48ms</text>
        <rect x="236" y="126" width="144" height="6" rx="3" fill="#2a3d5e"/>
        <rect x="236" y="126" width="62" height="6" rx="3" fill="#bba7ff" opacity="0.9"/>

        <circle cx="30" cy="160" r="5" fill="#f4bfd9"/>
        <text class="mono" x="44" y="164" fill="#eef4fc" font-size="13">pack</text>
        <text class="mono" x="118" y="164" fill="#f4bfd9" font-size="11.5">done</text>
        <text class="mono" x="196" y="164" fill="#8ba3c4" font-size="11.5">103ms</text>
        <rect x="236" y="154" width="144" height="6" rx="3" fill="#2a3d5e"/>
        <rect x="236" y="154" width="122" height="6" rx="3" fill="#f4bfd9" opacity="0.9"/>

        <circle cx="30" cy="188" r="5" fill="#142238" stroke="#8ba3c4" stroke-width="1.5"/>
        <text class="mono" x="44" y="192" fill="#eef4fc" font-size="13">ship</text>
        <text class="mono" x="118" y="192" fill="#8ba3c4" font-size="11.5">queued</text>
        <text class="mono" x="196" y="192" fill="#63788f" font-size="11.5">—</text>
        <rect x="236" y="182" width="144" height="6" rx="3" fill="#2a3d5e"/>

        <path d="M22 218l4.5 5.5 10.5-11.5" fill="none" stroke="#ffc978" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="mono" x="46" y="226" font-size="13"><tspan fill="#eef4fc">3 ripe · 1 queued · 0 failed</tspan><tspan fill="#8ba3c4"> · 163ms total</tspan></text>

        <rect x="0" y="250" width="404" height="26" fill="#1d3050"/>
        <line x1="0" y1="250" x2="404" y2="250" stroke="#2d4266"/>
        <text class="mono" x="16" y="267" fill="#8ba3c4" font-size="10.5">orchard/local · main · queue 1 · load 0.32</text>
        <text class="mono" x="388" y="267" fill="#5f7593" font-size="10.5" text-anchor="end">ctrl-c detach</text>
      </g>
    </g>
  </g>

