[package]
name = "loquat"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full", "sync"] }
tokio-util = "0.7"
rustyline = "13.0"
colored = "2.1"
ctrlc = "3.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
atty = "0.2"
tempfile = "3.8"
toml = "0.8"
regex = "1.10"
merge = "0.2.0"

# TUI dependencies
ratatui = { version = "0.24", features = ["all-widgets"] }
crossterm = { version = "0.27" }
