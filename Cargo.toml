[workspace]
resolver = "2"
members = [
    "loquat-tool",
    "loquat-kernel",
    "loquat-engine",
    "proto",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Loquat Contributors"]
license = "MIT"
repository = "https://github.com/Full-finger/Loquat"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
serde_bytes = "0.11"
serde_yaml = "0.9"

# gRPC
tonic = "0.11"
tonic-build = "0.11"
prost = "0.12"
prost-types = "0.12"

# HTTP/Web
axum = "0.7"
hyper = "1.0"
tower = "0.4"
tower-http = "0.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
indicatif = "0.17"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# System
sysinfo = "0.30"
nix = { version = "0.27", features = ["process", "resource"] }

# Utilities
lazy_static = "1.4"
parking_lot = "0.12"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

[workspace.metadata.release]
pre-release-replacements = [
    { file = "README.md", search = "version = \"[^\"]+\"", replace = "version = \"{{version}}\"" },
]

[package]
name = "loquat"
version = "0.2.0"
edition = "2021"
authors = ["Loquat Contributors"]
license = "MIT"
repository = "https://github.com/Full-finger/Loquat"
description = "A clean Rust web service framework with AOP and logging support"

[lib]
name = "loquat"
path = "src/lib.rs"

[[bin]]
name = "loquat"
path = "src/main.rs"

[dependencies]
# 使用workspace依赖
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
serde_bytes = { workspace = true }
serde_yaml = { workspace = true }
tonic = { workspace = true }
tonic-build = { workspace = true }
prost = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true, features = ["derive"] }
colored = { workspace = true }
indicatif = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
sysinfo = { workspace = true }
nix = { workspace = true, features = ["process", "resource"] }
lazy_static = { workspace = true }
parking_lot = { workspace = true }
async-trait = "0.1"

# 额外依赖
ratatui = "0.26"
crossterm = "0.27"
tokio-tungstenite = "0.21"
rustyline = "13.0"
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
atty = "0.2"
ctrlc = "3.4"
regex = "1.12"
tempfile = "3.10"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
