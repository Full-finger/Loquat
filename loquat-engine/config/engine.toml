# Loquat Engine Configuration

[engine]
# Engine唯一标识符（如果未指定则自动生成）
engine_id = ""

# 监听端口
port = 50052

# Kernel gRPC地址
kernel_address = "127.0.0.1:50051"

[plugins]
# 插件目录
plugin_dir = "./plugins"

# 自动加载插件
auto_load = true

# 热重载
hot_reload = false

# 沙箱模式
sandbox_mode = true

[adapters]
# 适配器配置目录
adapter_dir = "./adapters"

# 默认适配器
default_adapter = "mock_test"

[api]
# HTTP API地址
http_address = "127.0.0.1:8081"

# gRPC API地址
grpc_address = "127.0.0.1:50052"

[logging]
# 日志级别: trace, debug, info, warn, error
level = "info"

# 日志格式: json, pretty
format = "pretty"

# 日志文件
file = "./logs/engine.log"

[resources]
# 最大内存使用 (MB)
max_memory_mb = 512

# 最大线程数
max_threads = 4

# 连接池大小
connection_pool_size = 10

[performance]
# 缓存大小
cache_size = 100

# 请求超时 (秒)
request_timeout = 30

[security]
# 启用认证
enable_auth = false

# API密钥（如果启用认证）
api_key = ""
