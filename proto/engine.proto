syntax = "proto3";

import "package.proto";
import "google/protobuf/timestamp.proto";

package loquat.engine;

// Engine服务 - 流水线处理核心
service EngineService {
  // Engine 生命周期管理
  rpc Start(Empty) returns (EngineStatus);
  rpc Stop(Empty) returns (EngineStatus);
  rpc Pause(Empty) returns (EngineStatus);
  rpc Resume(Empty) returns (EngineStatus);
  rpc HealthCheck(Empty) returns (HealthStatus);
  
  // Package 处理
  rpc SubmitPackage(loquat.v1.Package) returns (loquat.v1.ProcessResult);
  rpc StreamPackages(stream loquat.v1.Package) returns (stream loquat.v1.ProcessResult);
  
  // Worker 管理
  rpc RegisterWorker(WorkerRegistration) returns (WorkerAck);
  rpc UnregisterWorker(WorkerId) returns (Empty);
  rpc ListWorkers(Empty) returns (WorkerList);
  rpc GetWorkerInfo(WorkerId) returns (loquat.v1.WorkerInfo);
  
  // Engine 信息
  rpc GetEngineInfo(Empty) returns (EngineInfo);
  rpc GetMetrics(Empty) returns (MetricSummary);
}

// 空消息
message Empty {}

// Engine 状态
message EngineStatus {
  enum State {
    UNKNOWN = 0;
    STARTING = 1;
    RUNNING = 2;
    PAUSED = 3;
    STOPPING = 4;
    STOPPED = 5;
    ERROR = 6;
  }
  State state = 1;
  string message = 2;
  google.protobuf.Timestamp timestamp = 3;
  int32 worker_count = 4;
  int32 packages_processed = 5;
}

// 健康状态
message HealthStatus {
  bool healthy = 1;
  string message = 2;
  google.protobuf.Timestamp last_check = 3;
}

// Worker 注册请求
message WorkerRegistration {
  string id = 1;
  string name = 2;
  loquat.v1.PoolState pool = 3;    // 固定池子
  int32 priority = 4;              // 同池子内排序
  repeated loquat.v1.TargetSite targets = 5; // 匹配规则
  map<string, string> metadata = 6;
}

// Worker 确认
message WorkerAck {
  bool success = 1;
  string message = 2;
}

// Worker ID
message WorkerId {
  string id = 1;
}

// Worker 列表
message WorkerList {
  repeated loquat.v1.WorkerInfo workers = 1;
}

// Engine 信息
message EngineInfo {
  string id = 1;
  string name = 2;
  string version = 3;
  google.protobuf.Timestamp start_time = 4;
  string environment = 5;
  map<string, string> metadata = 6;
}

// 指标摘要
message MetricSummary {
  map<string, double> metrics = 1;
  google.protobuf.Timestamp timestamp = 2;
  int64 packages_processed = 3;
  int64 packages_failed = 4;
  double avg_processing_time_ms = 5;
}
