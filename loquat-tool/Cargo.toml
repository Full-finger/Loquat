[package]
name = "loquat-tool"
version = "0.1.0"
edition = "2021"
description = "Development tool for Loquat framework"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
colored = "2.1"
dirs = "5.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
