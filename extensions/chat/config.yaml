# extensions/chat/config.yaml：LLM 对话插件配置。
# 改完保存即生效（下一条消息触发惰性热重载）。

enabled: true

# OpenAI 兼容后端（DeepSeek / TGW 的 openai 路径 / vLLM 等均可）
api_base: "https://api.deepseek.com/v1"
api_key: "sk-替换成你的key"
model: "deepseek-chat"

# 群聊触发：消息含任一触发词，或 @机器人，才回话；私聊全部回话
triggers: ["祥子"]

# 人设（system prompt）。想用 koishi 旧插件的人设，
# 去它的 src/characters/*.json 抄第一个 content 字段过来。
system_prompt: |
  你是一个友好的聊天机器人。回复保持简短、口语化。

# 对话参数
temperature: 0.8
max_tokens: 1024
history_limit: 20     # 每个会话（私聊/各群各一份）保留的最大消息条数
timeout_seconds: 60
